version: '3.6'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    tty: true
    volumes:
      - .:/app

    links:
      - redis-1:redis-1
      - redis-2:redis-2

  redis-1:
    image: "redis:5-buster"
    entrypoint: "redis-server --appendonly yes"

    volumes:
      - redis-data:/var/lib/redis

  redis-2:
    image: "redis:5-buster"
    entrypoint: "redis-server --appendonly yes --requirepass my-pass"

    volumes:
      - redis-2-data:/var/lib/redis

volumes:
  redis-data:
    driver: local
  redis-2-data:
    driver: local
